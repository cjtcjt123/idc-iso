name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Detect signing credentials
        id: signcheck
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate & provisioning profile
        if: steps.signcheck.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/build_certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security import /tmp/build_certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain-db
          security list-keychains -d user -s build.keychain-db login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Build archive (unsigned)
        run: |
          cd "$GITHUB_WORKSPACE/ios"
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then echo "ERROR: no .xcworkspace (pod install failed?)"; ls -la; exit 1; fi
          SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1}')
          # 排除 Pods / RN 依赖生成的资源包 scheme（如 boost / hermes / yoga 等），
          # 取 App 主 scheme。绝不能用“第一个 scheme”，否则会误选 boost 资源包。
          SCHEME=$(echo "$SCHEMES" | grep -viE "boost|privacy|hermes|react|yoga|folly|glog|doubleconversion|pods|rct" | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | head -1)
          if [ -z "$SCHEME" ]; then echo "ERROR: could not detect scheme"; xcodebuild -list -workspace "$WORKSPACE"; exit 1; fi
          echo "WORKSPACE=$WORKSPACE SCHEME=$SCHEME (all: $SCHEMES)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release clean archive \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        if: steps.signcheck.outputs.available != 'true'
        run: |
          ARCHIVE="$RUNNER_TEMP/build.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "ERROR: .app not found"; ls -R "$ARCHIVE/Products" | head -60; exit 1; fi
          echo "APP=$APP"
          rm -rf "$EXPORT"; mkdir -p "$EXPORT/Payload"
          cp -R "$APP" "$EXPORT/Payload/"
          cd "$EXPORT" && zip -qry idc-ops-unsigned.ipa Payload
          ls -lh *.ipa

      - name: Package signed IPA
        if: steps.signcheck.outputs.available == 'true'
        env:
          SIGN_METHOD: ${{ vars.SIGN_METHOD || 'ad-hoc' }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          PROFILE_NAME: ${{ vars.PROFILE_NAME }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import os, plistlib
          cfg = {
              'method': os.environ.get('SIGN_METHOD', 'ad-hoc'),
              'teamID': os.environ.get('TEAM_ID', ''),
              'signingStyle': 'manual',
              'provisioningProfiles': {os.environ.get('BUNDLE_ID', ''): os.environ.get('PROFILE_NAME', '')},
              'compileBitcode': False,
              'stripSwiftSymbols': True,
          }
          with open('exportOptions.plist', 'wb') as f:
              plistlib.dump(cfg, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist exportOptions.plist
          ls -lh "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Publish IPA as Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.ipa" | head -1)
          [ -z "$IPA" ] && { echo "no ipa, skip"; exit 0; }
          KIND="unsigned"
          [ "${{ steps.signcheck.outputs.available }}" = "true" ] && KIND="signed"
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "iOS #${{ github.run_number }} ($KIND)" \
            --notes "kind: $KIND / sha: ${{ github.sha }}" \
            --prerelease "$IPA" \
            || gh release upload "$TAG" "$IPA" --clobber
